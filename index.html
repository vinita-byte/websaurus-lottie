<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSaurus Lotties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--red:#D40016;--ox:#6E0A12;--ink:#171615;--graph:#2B2826;--paper:#F4F4F2;--cream:#EFE5DC;--muted:#4A4541}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Mono',monospace}
  main{max-width:1280px;margin:0 auto;padding:56px 16px 80px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:40px}
  h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(48px,8vw,96px);line-height:.9;letter-spacing:-.045em;text-transform:uppercase}
  h1 span{color:var(--red)}
  header p{margin:0;max-width:420px;font-size:15px;line-height:1.5;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
  .card{background:var(--paper);border-radius:20px;padding:16px;box-shadow:6px 6px 0 var(--graph);display:flex;flex-direction:column;gap:12px}
  .stage{aspect-ratio:1;border-radius:14px;background:var(--cream);cursor:pointer}
  .card.dark .stage{background:var(--ink)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  h2{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:-.02em}
  .meta{font-size:13px;color:var(--muted)}
  .card p{margin:0;font-size:14px;line-height:1.45}
  a.dl,button{font:500 13px 'DM Mono',monospace;color:var(--ink);background:none;border:2px solid var(--ink);border-radius:999px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  a.dl:hover,button:hover{background:var(--ink);color:var(--paper)}
  .actions{display:flex;gap:8px}
</style>
</head>
<body>
<main>
  <header>
    <h1><span>Web</span>Saurus<br>Lotties</h1>
    <p>Eight looping Lottie animations of the W2 mascot. Tap a stage to pause. Each file is plain Lottie JSON, ready for lottie web, iOS, Android, After Effects plugins or LottieFiles.</p>
  </header>
  <section class="grid" id="grid"></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
const items = [
  ['idle', 'Idle', 'Breathing, tail sway, a glance, a blink and a smug brow. The default loop.'],
  ['hype', 'Hype jump', 'Winds up, jumps, cackles in the air and lands with a squash.'],
  ['talk', 'Talk', 'Mouth flaps for voiceover and explainer videos.'],
  ['smug', 'Smug', 'The hot take. Eyebrow wiggle and a side eye.'],
  ['shocked', 'Shocked', 'The "wait, what?" moment, with a jolt and a tremble.'],
  ['thinking', 'Thinking', 'The upgrade. Looks up, thought dots pop in.'],
  ['cackling', 'Cackling', 'The useful chaos. Head bobbing laugh.'],
  ['avatar', 'Avatar', 'Animated profile picture on ink, for X and YouTube.', true],
];
const grid = document.getElementById('grid');
for (const [id, title, desc, dark] of items) {
  const file = `lottie/websaurus-${id}.json`;
  const card = document.createElement('article');
  card.className = 'card' + (dark ? ' dark' : '');
  card.innerHTML = `<div class="stage" role="button" tabindex="0" aria-label="Pause or play ${title}"></div>
    <div class="row"><h2>${title}</h2><span class="meta"></span></div>
    <p>${desc}</p>
    <div class="actions"><a class="dl" href="${file}" download>Download JSON</a></div>`;
  grid.appendChild(card);
  const stage = card.querySelector('.stage');
  const anim = lottie.loadAnimation({ container: stage, renderer: 'svg', loop: true, autoplay: true, path: file });
  anim.addEventListener('DOMLoaded', () => {
    card.querySelector('.meta').textContent = `${(anim.totalFrames / anim.frameRate).toFixed(0)}s · ${anim.frameRate}fps`;
  });
  const toggle = () => anim.isPaused ? anim.play() : anim.pause();
  stage.addEventListener('click', toggle);
  stage.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
}
</script>
</body>
</html>
